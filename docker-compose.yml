version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: naeos-crm-postgres
    environment:
      POSTGRES_DB: naeos_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: naeos-crm-redis
    ports:
      - '6379:6379'

volumes:
  postgres-data:
