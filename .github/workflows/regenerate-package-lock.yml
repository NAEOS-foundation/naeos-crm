name: Regenerate package lock

on:
  push:
    branches:
      - fix/m1-runtime-stabilization
    paths:
      - .github/workflows/regenerate-package-lock.yml
      - package.json
      - apps/*/package.json
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch whose package-lock.json should be regenerated
        required: true
        default: fix/m1-runtime-stabilization

permissions:
  contents: write

concurrency:
  group: package-lock-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Select target branch
        id: target
        shell: bash
        env:
          INPUT_BRANCH: ${{ inputs.target_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET="$INPUT_BRANCH"
          else
            TARGET="$REF_NAME"
          fi
          if [ "$TARGET" != "fix/m1-runtime-stabilization" ]; then
            echo "Refusing to modify unexpected branch: $TARGET" >&2
            exit 1
          fi
          echo "branch=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          node -e "const p=require('./package.json'); if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1);"

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean installation from regenerated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate package lock in CI"
          git push origin HEAD:${{ steps.target.outputs.branch }}

      - name: Dependency audit report
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high
