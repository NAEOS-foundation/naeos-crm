name: Update qs lock entry (temporary)

on:
  push:
    branches:
      - fix/dependency-audit-remediation

permissions:
  contents: write

jobs:
  update-qs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dependency-audit-remediation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
      - name: Update qs lock entry
        run: npm update qs --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
          else
            git commit -m "chore(deps): update qs lockfile to patched release"
            git push origin HEAD:fix/dependency-audit-remediation
          fi
