name: Refresh dependency lockfile (temporary)

on:
  push:
    branches:
      - fix/dependency-audit-remediation

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dependency-audit-remediation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
      - name: Regenerate lockfile without running lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
          else
            git commit -m "chore(deps): regenerate lockfile for security updates"
            git push origin HEAD:fix/dependency-audit-remediation
          fi
